; KEO - zone loading, pathfinding, navmesh and render/particle
; settings (src/base/config_keys.cpp, src/render/render_keys.cpp).
; Every key here is optional: a key that is absent, or left commented out
; as it is below, uses the built-in default shown on its line. The in-game
; Options -> KEO tab (settingsPanel) edits the most used of these settings
; directly (DEV builds show every row the tab has); every other key is
; set here.
; When the tab saves, every line in this file is left alone -- comments
; included -- except a key it actually changes: an existing, uncommented
; line for that key is updated in place, and a key with no such line is
; appended.

; settingsPanel: the KEO tab in the game's Options window. On by
; default; read at startup only.
# settingsPanel=true

; NavMesh worker pool size. 0 = automatic: half the logical CPUs, capped
; at 6. Read at startup only; a change needs a restart.
# navmeshWorkerCount=0

; navmeshBuildLockNarrow: the navmesh collision builders lock only the
; parts that race, on the game's own lock (true), or each whole build on
; the mod's lock (false). Read at startup only.
# navmeshBuildLockNarrow=true

; navmeshStallThrottle: when the navmesh build lock has refused every
; non-blocking acquisition for five seconds, no live holder can explain it
; and the engine's retry is spinning; true slows that retry to a few dozen
; attempts a second. See blStall= in the NM cache line.
# navmeshStallThrottle=true

; clusterGraphBypass: the connectivity pre-check the engine makes before it
; runs a full path search. true answers "connected" without consulting the
; cluster graph, so every pair reaches the search; the graph is stale and
; rejects reachable pairs, and walking it reads a navmesh section slot that
; can be replaced underneath it. false hands the check back to the game, so a
; pair the graph rejects never reaches the search. measure asks the graph and
; then waves the pair through regardless, so routing matches true while
; PathDiag's wave= reports how many pairs the graph would have refused and how
; their searches ended -- it pays false's read cost, so it is for a diagnostic
; session, not for playing. See conn= and wave= in PathDiag:.
; player, the default, asks the graph and waves the pair through only when the
; request being served belongs to a player character, so a rejection the graph
; makes about an NPC stands and the NPC is spared a full search that would fail;
; a check with no request behind it is never waved. It pays false's read cost
; too. See waveAuth=, waveGate= and gateRej= in PathDiag:.
# clusterGraphBypass=player

; pathCostLines: the hook_findPathFull record and its histograms/cap
; counters run whenever findPathFull is hooked; this key only controls
; whether the heartbeat's per-class AstarClass: detail lines print, on top
; of the compact AstarCap:/PathBusy: lines, which always print.
# pathCostLines=true

; islandFarSpan: the engine routes a far move order as one direct path when
; both ends sit in the same island -- a run of contiguous active cells -- and
; that path can exhaust the search budget and end the order well short. N > 0
; answers "not the same island" for a pair N or more cells apart, so the order
; walks toward the far cell leg by leg, as it does for a destination outside
; the island. 0 keeps the game's answer. Applies to every character, not only
; the player's. Read at startup only. See IslandSpan: in the log.
# islandFarSpan=2

; islandEdgeRing: getZoneEdge (the engine's edge-route leg finder) rays from
; the destination toward the character and stops at the first island face it
; crosses. For a same-island destination that face sits on the destination
; cell's own near boundary, so a far order still asks for one leg as long as
; the whole island, which can exhaust the search's node cap. This narrows the
; island list handed back to that one caller to the cells within Chebyshev 1
; of the character's own cell, so the leg is at most about 2 cells -- but
; only when that whole neighbourhood is present in the list; an incomplete
; one is left alone (see partial= in IslandSpan:). The ring is armed and its
; counters (ra=/filt/rm/partial/skip/big) run regardless of this key. false
; (default) computes and counts what it would remove without touching the
; list -- run this first; true removes it. Applies to every character, not
; only the player's. Read at startup only. See ring= in IslandSpan:.
# islandEdgeRing=false

; playerRepathTier: a player character's mid-walk re-request (the engine
; re-searching a path it is already following) asks the queue at the same
; priority an NPC's own request carries, so it waits behind every NPC in the
; queue instead of keeping the tier its original move order got. true keeps
; that tier on a re-request from a character the mod already recognizes as
; player-owned; false leaves the game's own priority alone and only counts
; which requests would have kept it. See playerRepath= in the Phase12 line.
# playerRepathTier=true

; unstitchGuard: the bounds test the cross-section un-stitch never makes.
; Tearing a navmesh instance down walks the connection records that stitched
; it to its neighbours and uses each record's recorded neighbour node index
; with no check that the neighbour still has that node; a stale record reads
; past the end of its node map and crashes. true drops such a record and
; walks the rest -- a record naming a node that is gone has nothing to
; un-stitch anyway. false restores the game's own unchecked walk.
# unstitchGuard=true

; stitchSourceLines: how many sets that lost records to unstitchGuard are
; described in the log (two "StitchSource DROP" lines each), naming who wrote
; the stale records: the stitch that wrote them, the graph they were drawn
; from, and whether that graph is still the one the neighbour carries. 0
; prints none. The counters and the "StitchSource" heartbeat are there either
; way. Read at startup only.
# stitchSourceLines=32

; graphVisitorGuard: the absent-instance test the pathfinding heuristic never
; makes. Estimating how far a search node still is from the goal needs the
; node's world position, which the search reads through the graph instance of
; the section the node belongs to; a section with no instance leaves that
; pointer empty and the read crashes. true keeps the node in the search with
; no estimate, so it is tried after every node that could be estimated, and
; every other route stays open. false restores the unchecked read.
# graphVisitorGuard=true

; graphExpandGuard: the same test one cache slot over. Expanding a search node
; needs the node's own position, read through the graph instance of the node's
; section, and that pointer is not checked either -- so a node the key above
; keeps in the search arrives here next. true drops such a node from the
; search and carries on with every other node in the queue; false restores the
; unchecked read.
# graphExpandGuard=true

; meshFaceGuard: the bounds tests the per-face bounding-box step never makes.
; Recomputing a navmesh section's cleared area reads each face's record for
; the first edge it uses and how many edges follow, then walks exactly that
; many edges with no check that any of them belong to the section; a face
; record whose first field is no longer an index sends that walk far outside
; the section and crashes. true leaves such a face out of the bounding box,
; which is what the step already does for a face with no edges. false
; restores the game's own unchecked walk.
# meshFaceGuard=true

; createInstanceGuard: stops the game freeing a navmesh piece still in use.
; When a late stitch job finishes for a piece that a newer generation has
; already queued or already added, the game builds the piece again anyway: it
; frees the queued copy and queues the freed memory, or it leaves the added
; copy in the pathfinder's list and frees its memory later; either way a later
; pass crashes. true skips that redundant call, so the piece keeps what it has.
; false leaves the call to the game but counts it; the minute line prints either way.
# createInstanceGuard=true

; hullDoublePushGuard: stops the physics thread deleting one object twice.
; Now and then the game queues the same physics object for destruction twice,
; for example a physics piece attached to a character that has just gone
; away. The physics thread deletes it, then deletes it again from memory that
; already holds something else, and the game crashes. true drops the second entry
; before the physics thread sees it, so the object is deleted once. false
; leaves the queue to the game but still counts each duplicate. The guard's
; once-a-minute line is written either way.
# hullDoublePushGuard=true

; stitchByteGuard: when the game finishes stitching an interior's navmesh, it
; clears a flag byte that interiors do not have, so the write lands on the
; first byte of whatever memory sits next to that interior. true skips that
; write for interiors; sectors, which do own the byte, are unchanged. false
; lets the game write it and only records what it hit. Each such write is
; logged either way, with a once-a-minute summary line.
# stitchByteGuard=true

; navmeshAdjExclusion: the game's navmesh generator was built to finish one
; piece of map before starting the next. With several workers, two neighbouring
; pieces can be built at once, and one then stitches onto the other's old copy
; while the game frees it (a crash, or silent memory damage). true makes a
; piece wait until its neighbours are built and handed to the game; other
; pieces keep building meanwhile. false lets them overlap as before and only
; counts how often they would have waited. A once-a-minute summary line is
; written either way.
# navmeshAdjExclusion=true

; k7PostDeathHold: the deleted-order re-issue (K7) drops a player move order
; the moment another task follows it. When the order's own end -- reaching a
; partial path or a path failure -- came first, and the other task is combat
; (or its recovery: self-preservation, running away, standing still, a
; forced stumble), true HOLDS the order instead and lets the deleted-order
; re-issue send it once the fight ends, up to 60 seconds. observe classifies
; and logs what would be held, but drops as false does. false is today's
; behaviour: every such swap drops, with no classification. The counters
; (k7Hold=, delRefuse=, gameDropWhy=) count in every mode.
# k7PostDeathHold=true

; k7DestReadyGate: before a deleted-order re-issue sends, wait up to 15
; seconds for the destination cell's outdoor navmesh instance to be in the
; world, so the re-issue is never sent into a load gap and does not spend
; one of the shared re-issue attempts on a search that has nowhere to route.
; false removes the wait only: the destination is still checked on every
; re-issue, and delRefuse=r counts what the wait would have refused.
# k7DestReadyGate=true

; k7ArrivalTrigger: when a tracked order stops far (over 1,000 units) from
; its destination while that destination cell's outdoor navmesh instance is
; not yet in the world (or was, within the last few seconds), arm a wait and
; re-issue at once the first poll the character is confirmed still stopped
; and the instance is in the world -- instead of waiting for the
; deleted-order re-issue's own 3-second stopped hysteresis. Every other K7
; gate (cooldown, budget, nudge, character state, destination match, zone
; accessibility, k7PostDeathHold, k7DestReadyGate) still applies. true
; (default) sends. false still arms and computes the would-have-sent time,
; and still logs "K7 arrival (observe)" with how much sooner it would have
; sent once the real deleted-order re-issue actually lands -- it only sends
; nothing itself. The counters (k7Arrive=w/x) count arming and expiry
; regardless of this key; only k7Arrive=s (an actual send) does not.
# k7ArrivalTrigger=true

; formationGatherPace: when a squad set to run together gathers before it
; travels, the members nearer the gather point walk slower, never below half
; speed, so everyone arrives at about the same time. The walk is the game's.
; On by default; false lets each member gather at the squad's own pace. Read
; at startup only.
# formationGatherPace=true

; navMeshLife: log one line each time a navmesh section joins or leaves the
; streaming collection, carrying the mesh it was built from, how many holders
; that mesh has and how big its face array is. Read-only, a few hundred lines
; a session, and independent of every other key so that two sessions run with
; different settings can be compared line for line. false silences it.
# navMeshLife=true

; unstitchProbe: read-only diagnostic. DEV builds only -- a PROD build reads the
; key and reports it as DEV-only and ignored. Before each navmesh instance is
; torn down it walks the cross-section connection records the teardown is
; about to walk and logs any recorded node index that would land outside
; the neighbour node map it will be used on, plus a periodic UnstitchProbe
; running: line carrying what was examined. Changes nothing either way.
# unstitchProbe=false

; sectionKeyProbe: read-only diagnostic. DEV builds only -- a PROD build reads the
; key and reports it as DEV-only and ignored. The world step indexes the streaming
; collection's instance array with the top 10 bits of a packed key and makes
; no bounds or NULL test; this records, for the last few such lookups, the
; array's size and base, the indices about to be used and whether any lands
; outside. A crash record then says whether the index was in range (the slot
; changed underneath) or out of it (the key itself is wrong). On by default,
; because a probe armed after the fault records nothing. Changes nothing.
# sectionKeyProbe=true

; escapePauseGuard: keep the escape menu's pause when a zone load finishes
; behind it. On by default. Off also turns off zoneCycleStats and
; zoneWedgeGuard below: the hook this installs is where they take their
; sample.
# escapePauseGuard=true

; townGuard: refuse a town's coverage refresh that carries a nonpositive
; timer, which is the engine's own signal that nothing in that coverage is
; leased. On by default.
# townGuard=true

; zoneRetention: hold a cell the game has taken over from the mod past its
; countdowns, as the retention policy says. Off leaves expiries to the engine,
; except that a cell still waits for a navmesh job working on it. On by default.
# zoneRetention=true

; log a hash of every generated navmesh (DEV default on). Default: true in
; DEV builds, false in PROD builds (the line below shows the PROD default).
# navmeshMissHash=false

; navmeshMissSplit: navmesh generation on a worker runs outside the lock
; the other navmesh jobs wait on, so several can generate at once (true),
; or one at a time under it (false). Read on every generation.
# navmeshMissSplit=true

; navmeshMissSplitBg: the same for the generation the background navmesh
; thread runs itself, which otherwise holds that lock for its whole job.
; Needs navmeshMissSplit. Read on every generation.
# navmeshMissSplitBg=true
; zoneCycleStats: measure each zone-manager loading cycle (ZoneCycle: and
; ZoneCycleSum:), the player characters standing in a cell the mod holds
; privately (ZonePriv:) and Set B's own size on the ZoneLeak: line. Reading
; only; no behaviour changes either way. Default: true in DEV builds, false
; in PROD builds (the line below shows the PROD default).
# zoneCycleStats=false

; zoneWedgeGuard: report once (ZoneWedge:) if a loading cycle ever gets stuck
; in one phase for more than 10 seconds -- a permanent hang, not a slow load.
; Reading only; never forces the phase forward. Default: true in both DEV and
; PROD builds.
# zoneWedgeGuard=true

; zoneGeometryMode: the geometry contract a prepared zone is handed over
; under. contentOnly prepares the zone's content and claims nothing about its
; navmesh, which is what every build does today; the mod still measures how
; often a generated mesh's geometry inputs moved underneath it (ZoneGeomCert:)
; without changing what it stores. Any other value is refused with a log line.
# zoneGeometryMode=contentOnly

; How many navmesh generations may run at once when navmeshMissSplit is on.
; 0 = automatic (the logical CPU count less three, at most four; one on CPUs
; with under five logical cores), 1-4 = that many. Read at startup only.
# navmeshGenConcurrency=0

; playerCharRegistry: watch every player-faction character, not only the
; ones carrying a move order, so the zone a character stands in keeps its
; place in the navmesh queue and in what the mod loads and promotes first.
; Read on every scan.
# playerCharRegistry=true

; reprioFast: reorder the navmesh job queue on the reprioritizeInterval
; cadence below, and once more the moment a move order is issued, instead
; of a 3 second backstop that runs only while something is tracked. Off is
; a slower cadence, not no reprioritization.
# reprioFast=true

; Seconds between navmesh queue reorders while reprioFast is on (1-30).
# reprioritizeInterval=1.0

; routeTier: the zone a character with a move order stands in takes the top
; navmesh tier instead of the second, so it is generated before the zones
; around the camera. It also orders which preloaded zones the mod registers
; and promotes first.
# routeTier=true

; pathExtractGuard: a fault inside the path-result extraction loop rolls the
; result back to "no new edges" instead of taking the process down; the
; character re-paths on the next tick. Counted on the PathGuard: log line.
# pathExtractGuard=true

; sectionStamp: count every instance the navmesh streaming collection
; takes, so a log says whether that table is taking inserts at all.
; Counted on the PathGuard: line (addInst=).
# sectionStamp=true

; navMeshUpdateGuard: a fault inside the navmesh/path thread's update pass
; kills that thread while it holds the navmesh change lock, and nothing can be
; ordered to move anywhere for the rest of the session. The guard records that
; fault to navmesh_guard.txt -- the faulting address, the lock state and the
; call chain that proves which thread owned the lock -- and then deliberately
; leaves the lock held.
;
; It is a recorder, not a repair, and leaving the lock held is the point: the
; fault means something in the navmesh data is already damaged, and the lock is
; what keeps every other thread out of it. Released instead, the next thread to
; read that data crashes the game outright.
;
; What a latched session looks like: the game keeps running, menus and time
; still work, and the cannot-navigate-here cursor appears everywhere -- no
; character can be ordered to move.
;
; RE_Kenshi's crash handler will also put up a dialog asking whether to force a
; save before the game crashes. That dialog is the save offer: click Yes. It
; writes emergency_save_N and points settings.cfg's continue= at it, so that is
; what Continue will load next time. The game exits after either answer, so
; there is nothing to quit and no later chance to save.
;
; Send navmesh_guard.txt with the report.
# navMeshUpdateGuard=true

; physPurecallRecord: a forensic-only recorder on PhysXCore64.dll's own
; pure-virtual-call handler. A pure virtual call there is a CRT abort, not an
; exception the mod's own crash handler can see, so this instead captures the
; faulting thread, the real call site and a timestamp into purecall_dump.txt
; just before the process dies. It writes nothing unless PhysXCore64.dll's
; bytes match this build's signature. Read at startup only.
# physPurecallRecord=true

; physQueryGuard: the game's box query can hand back a collision shape that
; has already been destroyed, and reading it calls a pure virtual function,
; which kills the process instantly with no crash report. This checks each
; result before it is used and drops a dead one; the object it drops is one
; that was leaving the world anyway. On by default. Read at startup only.
# physQueryGuard=true

; corpsePin: a squad whose only member is a carried NPC corpse otherwise
; stays pinned at the pickup spot forever, which is what gets bodies shelved
; or destroyed on a save reload or a long carry. This repositions such a
; squad to the carrier instead. On by default; false skips the hook
; entirely. Read at startup only.
# corpsePin=true

; nestValidationGuard: SectionManager::finalizeZoneResources otherwise
; destroys a nest permanently whenever its position fails validation against
; a navmesh that has not landed yet. This detour asks the real readiness
; function first and skips the call entirely when the cell's mesh is not in;
; a skipped cell is revalidated on the next loading cycle. On by default;
; false runs the original as before this guard existed. Read on every call.
# nestValidationGuard=true

; townClaimFix: in a zone the game has not saved yet, it re-checks the town
; of a building the player places and skips player towns, so an NPC town
; nearby can claim it and the player can no longer dismantle it. This keeps
; the town the placement chose, or the player town whose radius holds it,
; or none. Snaps onto the player's own buildings keep the game's choice. On
; open ground inside an NPC town's radius, where one of the player's towns
; also covers the spot, a building that does not create a player town and
; arrives with no town, or with a player town whose own radius misses the
; spot, keeps the game's own choice: in a zone not yet saved, that NPC town,
; whose power the building then draws. On by default; false skips both
; hooks and the patch. Read at startup only.
# townClaimFix=true

; throwOutFix: a town's guards can carry a knocked-out intruder out and
; back in forever. This marks the body outside where it is dropped, and
; keeps a body they threw out off their list until it wakes or
; throwOutHoldMinutes of game time pass. On by default; false skips every
; hook. Read at startup only.
# throwOutFix=true

; throwOutHoldMinutes: the longest a thrown-out body stays off the guards'
; list, in game minutes (1 to 1440). Read at startup only.
# throwOutHoldMinutes=60

; wallSpliceFix: a wall that is finished or repaired reaches the navmesh
; through a local patch, which the game queues before the wall's collision
; moves into the group the navmesh reads, so the wall can stay missing until
; the zone is rebuilt. This issues the patch on the main thread once the
; collision is in. On by default; false leaves the game's own patch. Read
; at startup only.
# wallSpliceFix=true

; backpackFirstDefault: characters put picked-up items into their worn
; backpack before their own inventory. The checkbox in a character's
; backpack window sets that character's choice, which is saved with the
; game; this is the choice of every character without one. Read at startup
; only.
# backpackFirstDefault=true

; backpackFoodScore: a character with food in its worn backpack no longer
; walks off to eat food from the ground. On by default; false skips the
; hook. Read at startup only.
# backpackFoodScore=true

; backpackDialogueFunction: a dialogue line that needs an item of a kind
; also finds it in the tested character's worn backpack, as a line that
; needs one particular item already does. On by default; false leaves the
; game's check. Read at startup only.
# backpackDialogueFunction=true

; operatorFillBeforeDeliver: a player's operator on a mine, farm, refinery
; or resource bench keeps collecting until its inventory and backpack are
; full, then delivers. It delivers as the game does while hungry, when the
; machine is unpowered or its inputs are wrong, and at gear benches. On by
; default; false skips the hook. Read at startup only.
# operatorFillBeforeDeliver=true

; camFocus: predict the camera's zone from its orbit/follow anchor (where it
; is pointed) instead of its own position, so a zoomed-out, rearward-pitched
; camera still preloads the zone the squad is walking into. false reverts to
; the raw camera position. On by default.
# camFocus=true

; camFocusMaxDist: soft cap, in world units, from the nearest squad member
; before the focus point is pulled back toward them; camFocusHardMult times
; this is the hard cutoff past which the focus point is ignored outright
; (free camera, looking across the map). <= 0 = one zone width.
# camFocusMaxDist=0
# camFocusHardMult=3.0

; camFocusHysteresis: once the camera-focus prediction picks a neighbouring
; zone on an axis, world units the axis distance must fall back below the
; preload threshold before that prediction is released; a different
; neighbour needs the axis to exceed the threshold by this much to take
; over. Only applies while camFocus is on. Keeps a point oscillating near a
; zone border from thrashing preload/priority every frame.
# camFocusHysteresis=250

; zoneLifeRetainRadius: radius, in zones around the camera, inside which the
; zones the mod loaded stay loaded: 1 keeps a 3x3, 2 a 5x5 (1-4). The game
; itself keeps a 3x3 around the camera. Applied live from the KEO tab.
# zoneLifeRetainRadius=1

; zoneLifeSquadRadius: the same radius around each player character away
; from the camera (0-4). 0 keeps only the zone each one stands in, as the
; game does by itself (a 3x3 with its "Fast zone hopping" option): the mod
; then loads and keeps nothing extra around far squads, and switching the
; camera to one of them loads its surroundings at that moment. 1 keeps and
; preloads a 3x3 around each. Applied live from the KEO tab.
# zoneLifeSquadRadius=1

; zoneRetentionMaxHeld: how many zones the mod may keep loaded beyond the
; ones the game keeps by itself (12-45). Past it the mod keeps only the zones
; right around the camera and the player's characters, and stops preloading
; around squads away from the camera, until the count falls a fifth below
; it. Applied live from the KEO tab.
# zoneRetentionMaxHeld=45

[Bench]
; The in-game benchmark runs from the KEO tab of DEV builds only.
;
; Comma list of the levers below the in-game benchmark's lever A/B measures
; this run (e.g. reflectionHalfRate,particleStepCap); a lever left off this
; list keeps the user's setting in every set instead of being turned off in
; "off". Empty or absent: every lever below. "combined" measures only two
; sets, every lever off and the user's levers (4 windows a run). Read at
; startup only.
# bench.levers=

; The Full sweep button's legs, run in turn: a comma list of <slot>:<speed>
; (slot swamp, city, road, custom or sand; speed 1 or 20). A leg takes about
; 14 s + 56 s x sets (2 sets combined, else the lever count + 2): the six
; default legs about 13 min combined, about an hour with every lever.
; Read at startup only.
# bench.sweep=swamp:1,swamp:20,city:1,city:20,sand:1,sand:20

[Render]
; Rendering optimizations: master switch for every key in this
; section. Not itself visible; a change needs a restart.
# renderLevers=true

; Renders the water reflection every other frame. Visible: one-frame-
; stale reflection in a 512x512 distorted target.
# reflectionHalfRate=true

; Looping effects out of view stop updating after the off-screen time
; below. Visible: off-screen smoke resumes where it stopped.
# particleOffscreenSkip=true

; Above the game speed below, particle effects advance in capped steps.
; Visible: smoke and fire animate slower at high game speed (20x).
# particleStepCap=true

; The game speed above which particleStepCap applies. Not itself visible.
# particleStepCapSpeed=3

; How long (game seconds) a looping effect must be out of view before it
; stops updating. Not itself visible; paired with particleOffscreenSkip.
# particleOffscreenSeconds=0.5

; Effects younger than this (game seconds) are never paused. Not itself
; visible; paired with particleOffscreenSkip.
# particleOffscreenMinAge=10

; Comma list of particle-template-name substrings, matched case-
; insensitively, that count as looping for particleOffscreenSkip. Not
; itself visible.
# particleLoopingNames=fire,smoke,torch,rain,weather

; Skips a render pass's character animation update when no visible
; character needs one (the pass still places attached gear). Visible:
; none. Its counts are on the Render: log line.
# oldAnimSkip=true

; Remembers where each shader constant lives, so drawing no longer
; searches the shader's constant list by name for every constant of every
; draw. Visible: none.
# gpuParamCache=true

; Leaves out of each shadow cascade the casters that cannot shadow any
; pixel the cascade lights (a caster must lie toward the sun from one).
; Visible: none by construction.
# shadowReachCull=true

; Turns the debug and interior-mask render passes off while they would
; draw nothing: their render queues are empty (no debug lines, stuck
; arrows or placement ghosts; no building interior loaded), or nothing in
; them is shown and inside the camera's view. Not visible: a pass comes
; back in the frame an object it would draw appears, and fog volumes
; still fade in and out at their usual speed because the lever makes up
; the fade steps the skipped passes would have taken.
# emptyPassSkip=true

; Above foliageBudgetSpeed, stops building foliage pages for the rest of a
; frame once this many milliseconds have gone to them; the layers left out
; update in the next frames, in turn. 0 is off. Visible: trees and grass
; may appear a few frames later at high game speed. The Render: line's
; foliage=<calls>/<skipped>/<msMax> field counts the updates, the ones left
; out and the slowest frame's total (ms) while the budget is set.
# foliagePageBudgetMs=0

; The game speed above which foliagePageBudgetMs applies. Not itself
; visible.
# foliageBudgetSpeed=3

; Before a draw sends its shader constants to the graphics card, compares
; them with what the card already holds for that shader and sends nothing
; when they are the same (more than half of all sends, measured). Visible:
; none. With it on, the Render: line's
; uploadSkip=<sends>/<skipped>/loop field counts both per pass, and
; uploadPlan= how many shaders' copy plans were worked out in the window.
# gpuUploadSkip=true

; Leaves out the per-cycle Ogre resource purge (four resource-group unloads
; plus the TextureManager and MeshManager unloads) while the loading cycle
; running it was raised by the background zone-adoption mechanism and no
; real transition ever joined it; a real transition's purge always runs.
; Forces a run anyway once it has been skipped for
; adoptOgrePurgeMaxSkipSeconds, so unreferenced content cannot pile up
; forever. Visible: none. With it on, the Render: line's
; ogrePurge=<calls>/<skipped>/<fallback> field counts every intercepted
; purge call, how many were left out and how many ran only because of the
; timeout.
# adoptOgrePurgeSkip=true

; How long adoptOgrePurgeSkip can skip the purge before forcing a run.
; 0 or lower never forces one. Not itself visible.
# adoptOgrePurgeMaxSkipSeconds=120

; Writes the Render: line to KEO.log every 30 seconds: main-
; loop passes, water reflections kept and skipped, fog fade updates made
; for skipped reflections (reflFog), particle timeouts set,
; cleared, refused (record full) and outstanding, capped particle steps,
; shader constant lookups and cache hits per pass, shadow casters cut,
; with shadowReachDiag on the shadow reach counts, sun angle and nearest
; visible depth against the cascade splits, and with oldAnimSkip or
; oldAnimDiag on the old-animation calls per pass and how many were
; skipped or skippable (plus the check's time with oldAnimDiag), and with
; gpuUploadDiag on the constant-buffer uploads, identical uploads and
; identical bytes per pass, with gpuUploadSkip on the uploads and the ones
; skipped per pass, and with emptyPassSkip on whether the Debug and
; InteriorMask nodes are off now (debugOff, maskOff), the frames each was
; off out of all frames (passOffFrames), node switches (passSw), fog
; fade updates made for skipped passes (fogComp), the frames each stayed
; on for an object it might draw (passVis=<debug>/<mask>, or passVis=off
; when only empty queues switch them), the frames a node stayed on
; because the check could not tell (visUnsure) and, per node, the most
; objects it tested in one frame (visScanMax=<debug>/<mask>; the check
; stops at the first object that may draw, so this is the queue's whole
; count only in a frame the node went off), and with
; foliagePageBudgetMs set the foliage updates, the ones left out and the
; slowest frame's total in ms (foliage), and with adoptOgrePurgeSkip on the
; purge calls intercepted, skipped and forced by the timeout (ogrePurge).
; Visible: none, log only. Default: true in DEV builds, false in PROD
; builds (the line below shows the PROD default).
# renderDiag=false

; Diagnostic counters with no visible effect, reported on the Render: log
; line above. Installed only in DEV builds, where the KEO tab shows
; their rows; off by default, switched on for a measured window.
;   shadowReachDiag: counts the shadow casters that can reach a lit pixel,
;   and logs the nearest visible depth against the cascade splits.
# shadowReachDiag=false
;   gpuParamLookupDiag: counts shader constant lookups per frame.
# gpuParamLookupDiag=false
;   oldAnimDiag: counts the animation passes oldAnimSkip could skip and
;   times its check.
# oldAnimDiag=false
;   gpuUploadDiag: counts shader constant uploads whose bytes equal the
;   buffer's previous upload. It never skips one, but while on it repeats
;   each upload's constant lookups and keeps a copy of every buffer (up to
;   64 MB), so it slows the frame it measures. While it is on,
;   gpuUploadSkip skips nothing.
# gpuUploadDiag=false
