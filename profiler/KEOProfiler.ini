; KEOProfiler - frame audit settings (KenshiFrameAudit.cpp).
; Output goes to <mod folder>\audit\<date_time>[_Tag].log / _sec.csv /
; _frames.csv / _phys.csv / _physq.csv (as enabled below).
; A missing key uses the default shown here.

[Audit]
; 0 = legacy profiler only (no audit hooks, no audit files).
Enabled=1
; Length of each [AUDIT] summary window, seconds.
SummarySec=10
; Frames longer than this get a [SLOW] line (at most SlowMax per window).
SlowMs=33.3
SlowMax=30
; Frames longer than this (loading hitches) are left out of the percentiles.
StallMs=1000
; One CSV row per second (1) and one row per frame (0 = off; per-frame output adds overhead).
CsvSeconds=1
CsvFrames=0
; Added to the output file names, e.g. Tag=town_far_20x.
Tag=
; 1 = frames start at Ogre Root::renderOneFrame, 0 = at MainListener::frameStarted.
FrameBoundary=1
; Ogre scene update / compositor passes / Present split.
OgreSplit=1
; Count draw calls (RenderSystem::_render), shadow draws separately.
Draws=1
; Physics and birds thread bodies (wake and run times).
ThreadBodies=1
; Time the AI thread's per-character visibility check (one probe call per character).
AiVis=1
; Time the AI thread's three per-character list loops (threadedUpdate, 4, periodic).
AiLists=1
; Break the render passes down per scene call (camera, viewport, render queues, shadow
; cascade: cull / queue build / submit) and count draws by Renderable class and by mesh.
RenderDetail=1
; Also time the worker barrier, the per-cull animation pre-pass and the D3D11 per-draw
; path (constant buffers, draw submission). Adds per-draw overhead; 0 = off.
RenderDeep=1
; Rows in each [AUDIT-DRAWS] / [AUDIT-MESH] / [AUDIT-AI] table.
DrawTop=12
; Particle effects. Each frame, right before the particle job, count Kenshi's active
; effects per ParticleUniverse template (alive, on screen, stopping, live particles,
; entries into / exits from the active list), and time every
; ParticleUniverse::ParticleSystem::_update split by on/off screen. Per-frame columns
; fx*, fxUpd (worker CPU ms), fxUpdOff (off-screen share), fxUpdMain (zone effects,
; serial on the main thread), fxCensus (the census itself); per-window [AUDIT-FX] table.
; 0 = off.
Particles=1
; Rows in each [AUDIT-FX] table.
ParticleTop=20
; PhysX contention detail. Records physics queue sizes and subphase timings plus
; each mouseScan ray / isIndoors burst's duration, physics phase and read-only core
; scene-lock owner. Writes _phys.csv and _physq.csv; 0 disables these probes.
PhysXDetail=1
; Autosave / save breakdown. Splits SaveManager::saveGame -- the blocking
; main-thread frame behind the autosave hitch -- into its stages and writes an
; [AUDIT-SAVE] block per save: total, per-stage ms/calls, the derived zone
; duplicate-scan cost, the slowest zones, and the SaveFileSystem thread's
; asynchronous copy. Inert outside a save. 0 = off.
SaveDetail=1
; Per-zone rows in each [AUDIT-SAVE] block, slowest first.
SaveTop=10
; Comma list of hook/site names to skip, e.g. DisableSites=zoneCam,renderSystemRender,renderSingleObject
DisableSites=
; 1 = timeBeginPeriod(1) at startup. Changes game timing; tagged in the header and file names.
TimerExperiment=0
; Keep the old [FPS] periodic / pre-transition lines.
LegacyFps=1
; Cursor-ray split. 0 = off. N = on every Nth frame that casts the cursor ray, right
; after the game's own ray, cast five more with the same origin and direction
; (all shapes, static only, dynamic twice back to back, dynamic without the character
; groups) and time each. Those frames are left out of every statistic and
; summarised on [AUDIT-CURSPLIT]. Adds several ms to each such frame at 20x.
; build.bat copies this file only when the build folder has none: add the keys to an
; existing KEOProfiler.ini by hand.
CursorSplitEvery=0
; Collision groups counted as character hits (curChar, .char) and masked out of the
; split's dynNoChar ray, as a bit mask (hex or decimal). The default 0x07800000 is
; groups 23-26; 0x1B is groups 0/1/3/4, where mouseScan itself looks for characters.
; The groups= histogram on [AUDIT-CURSOR] shows which groups the hits fall in.
CursorCharGroups=0x07800000
; Time each Ogre frame-listener class (frameStarted/Queued/Ended, post-animation) and write [AUDIT-LISTENERS] every 5 s.
Listeners=1
; PhysX hull destroy-queue diagnostic. Follows every hull address through
; PhysicsInterface::hullsToDestroy (the pushes, the flush to the physics thread, its
; delete batch, the deleting destructors) and flags a hull queued twice, queued after
; its destructor ran, pushed off the main thread, or deleted outside the batch.
; Writes [AUDIT-HULLS]: totals every 5 s, one line for each of the first 8 anomalies
; of each kind, and the last 64 events once per kind, at its first anomaly. A fault on
; the physics thread inside its delete batch writes audit\<run>_hullcrash.txt. Adds 15
; hooks, a fault handler and an 8 MB table. Disabling any one of its sites in
; DisableSites refuses the whole diagnostic. 0 = off (nothing installed).
HullDiag=0
; Per-thread CPU time. Once a second, read every thread's CPU cycles and write one row per thread
; that ran to audit\<run>_cpu.csv (t, tid, role, cycles, cpuMs, wallMs, start module), plus the
; process total and what no listed thread accounts for; every 30 s an [AUDIT-THREADS] line maps
; each thread id to its role (main, ai, phys, birds, reporter, ogre, other). Runs on the audit's
; own reporter thread. 0 = off.
CpuSample=1
; Steady-state cost probes. Time Character::update and Character::pausedUpdate per call (player and
; NPC apart) with the animation update inside them, the per-character calls inside charsUpdate
; (periodicUpdate, fourFrameUpdate, postUpdate, the removal list and death parade), Faction::update
; and its active-platoon part, the faction periodic update, FactionRelations::update on the AI
; thread with the relation entries it walks, one platoon update per faction on the AI thread, and
; the formation lookups and rebuilds. Columns cuMs ... fmBuildMs, relMs, afPlatoonU and the counts
; cuN ... players; an [AUDIT] <class> detail line per window. Adds two clock reads per character
; per frame on the main thread. 0 = off.
SteadyDetail=0
